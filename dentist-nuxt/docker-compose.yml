services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dentist
      POSTGRES_USER: dentist
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - dentist_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U dentist -d dentist']
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  dentist_pgdata:
